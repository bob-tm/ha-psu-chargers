- id: eeprom_writing_action
  mode: queued
  parameters:
    state: bool
  then:
    - if:
        condition:
            # at boot esphome try to init params 
            - lambda: 'return (millis() > 5000);'
        then:      
            - canbus.send:
                use_extended_id: true
                can_id: 0xC0103
                data: !lambda "return prepare_can_packet_set_bit(0xC2, 10, id(mw_config_c2), state);"
            - delay: 50ms
            - script.execute: { id: canbus_refresh, cmd: 0xC2 }

- id: psu_mode_action
  mode: queued
  parameters:
    state: bool
  then:
    - if:
        condition:
            # at boot esphome try to init params 
            - lambda: 'return (millis() > 5000);'
        then:      
            - canbus.send:
                use_extended_id: true
                can_id: 0xC0103
                data: !lambda "return prepare_can_packet_set_bit(0xB4, 7, id(mw_config_b4), state);"
            - delay: 50ms
            - script.execute: { id: canbus_refresh, cmd: 0xB4 }


- id: canbus_refresh
  mode: queued
  parameters:
    cmd: int  # Указываем, что параметр 'cmd' имеет тип целое число
  then:
    - canbus.send:
          use_extended_id: true
          can_id: 0xC0103
          data: !lambda |-
            return { (uint8_t)cmd, 0x00 };
    - delay: 50ms
          
          
- id: canbus_read_vendor_info
  mode: queued
  then:
      - canbus.send:
          use_extended_id: true
          can_id: 0xC0103
          data: [0x80, 0x00]  #Manufacturer name 0_5
      - delay: 50ms # delay between sends minimum 30 ms to allow for receiving of the result to happen
      - canbus.send:
          use_extended_id: true
          can_id: 0xC0103
          data: [0x81, 0x00]  #Manufacturer name 6_11
      - delay: 50ms
      - canbus.send:
          use_extended_id: true
          can_id: 0xC0103
          data: [0x82, 0x00]  #Model name 0_5
      - delay: 50ms
      - canbus.send:
          use_extended_id: true
          can_id: 0xC0103
          data: [0x83, 0x00]  #Model name 6_11
      - delay: 50ms
      - canbus.send:
          use_extended_id: true
          can_id: 0xC0103
          data: [0x84, 0x00]  #Firmware
      - delay: 50ms
      - canbus.send:
          use_extended_id: true
          can_id: 0xC0103
          data: [0x85, 0x00]  #Factory
      - delay: 50ms
      - canbus.send:
          use_extended_id: true
          can_id: 0xC0103
          data: [0x86, 0x00]  #Manufacture Date
      - delay: 50ms
      - canbus.send:
          use_extended_id: true
          can_id: 0xC0103
          data: [0x87, 0x00]  #Serial 0_5
      - delay: 50ms
      - canbus.send:
          use_extended_id: true
          can_id: 0xC0103
          data: [0x88, 0x00]  #Serial 6_11
      - delay: 50ms

