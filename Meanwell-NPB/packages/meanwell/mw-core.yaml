script: !include mw-scripts.yaml

esphome:
  name: ${esphome_name}

  includes:
    - packages/meanwell/mw-helpers.h

  on_boot:       
      - priority: -100
        then:
          - component.update: build_time
          - text_sensor.template.publish:
              id: psu_charger_status
              state: "Idle"
          - delay: 5s 
          - script.execute: {id: canbus_read_vendor_info}
          - delay: 50ms
          #- if:
          #    condition:
          #      - switch.is_on: autostart_switch
          #    then:
          #      - switch.turn_on: main_power              # PowerON via PINS
          #      - switch.turn_on: power_meanwell_button   # PowerON via CAN
          #      - delay: 50ms
        
globals:
  - id: mw_string_buffer
    type: std::string
    initial_value: '""'

  - id: mw_config_c2
    type: uint16_t
    initial_value: '0'
    
  - id: mw_config_b4
    type: uint16_t
    initial_value: '0'

  - id: mw_config_b8
    type: uint16_t
    initial_value: '0'

  - id: psu_autostart_voltage
    type: float
    initial_value: '0'
    
    
  - id: psu_charger_stage1_cc_start_ms
    type: uint32_t
    initial_value: '0'

  - id: psu_charger_stage2_cv_start_ms
    type: uint32_t
    initial_value: '0'

  # used to detect CC to CV stage change
  - id: psu_charger_cv_confirm_counter
    type: int
    initial_value: '0'

    
number:
  - platform: template
    name: "Boost Charger Stage 2 (Boost CV) Max Time"
    id: psu_charger_stage2_max_time
    optimistic: true
    unit_of_measurement: "Min"
    restore_value: true
    initial_value: 0  
    min_value: 0
    max_value: 360
    step     : 5

  - platform: template
    name: "_PSU target current"
    id: meanwell_next_target_current
    optimistic: true
    set_action:
      - script.execute: {id: canbus_set_param_f001, cmd: 0x30, x: !lambda "return x;"}
      - script.execute: canbus_read_priority2
    unit_of_measurement: "A"
    min_value: ${min_current}
    max_value: ${max_current}
    step: ${step_current}

  - platform: template
    name: "_PSU target voltage"
    id: meanwell_next_target_voltage
    optimistic: true
    set_action:  
      - lambda: 'ESP_LOGI("PSU_SET_VOLTAGE", "Set PSU Target Voltage to %.2fV. ", x);'
      - script.execute: {id: canbus_set_param_f001, cmd: 0x20, x: !lambda "return x;"}
      - script.execute: canbus_read_priority2
    unit_of_measurement: "V"
    min_value: ${min_voltage}
    max_value: ${max_voltage}
    step: ${step_voltage}

  - platform: template
    name: Charge Const Current
    id: mw_curve_cc
    optimistic: true
    set_action:
      - script.execute: {id: canbus_set_param_f001, cmd: 0xB0, x: !lambda "return x;"}
      - delay: 50ms
      - script.execute: canbus_charging_params
    unit_of_measurement: "A"
    min_value: ${min_current}
    max_value: ${max_current}
    step: ${step_current}

  - platform: template
    name: Charge Const Voltage
    id: mw_curve_cv
    optimistic: true
    set_action:
      - script.execute: {id: canbus_set_param_f001, cmd: 0xB1, x: !lambda "return x;"}
      - delay: 50ms
      - script.execute: canbus_charging_params
    unit_of_measurement: "V"
    min_value: ${min_voltage}
    max_value: ${max_voltage}
    step: ${step_voltage}

  - platform: template
    name: Charge Float Voltage
    id: mw_curve_fv
    optimistic: true
    set_action:
      - script.execute: {id: canbus_set_param_f001, cmd: 0xB2, x: !lambda "return x;"}
      - delay: 50ms
      - script.execute: canbus_charging_params
    unit_of_measurement: "V"
    min_value: ${min_voltage}
    max_value: ${max_voltage}
    step: ${step_voltage}

  - platform: template
    name: Charge Taper Current
    id: mw_curve_tc
    optimistic: true
    set_action:
      - script.execute: {id: canbus_set_param_f001, cmd: 0xB3, x: !lambda "return x;"}
      - delay: 50ms
      - script.execute: canbus_charging_params
    unit_of_measurement: "A"
    min_value: ${min_current}
    max_value: ${max_current}
    step: ${step_current}

  - platform: template
    name: Charge timout CC 
    id: mw_timeout_cc
    optimistic: true
    set_action:
      - script.execute: {id: canbus_set_param_int, cmd: 0xB5, x: !lambda "return x;"}
      - delay: 50ms
      - script.execute: canbus_charging_params
    unit_of_measurement: "Min"
    min_value: ${min_timeout}
    max_value: ${max_timeout}
    step     : ${step_timeout}

  - platform: template
    name: Charge timout CV
    id: mw_timeout_cv
    optimistic: true
    set_action:
      - script.execute: {id: canbus_set_param_int, cmd: 0xB6, x: !lambda "return x;"}
      - delay: 50ms
      - script.execute: canbus_charging_params
    unit_of_measurement: "Min"
    min_value: ${min_timeout}
    max_value: ${max_timeout}
    step     : ${step_timeout}

  - platform: template
    name: Charge timout FV
    id: mw_timeout_fv
    optimistic: true
    set_action:
      - script.execute: {id: canbus_set_param_int, cmd: 0xB7, x: !lambda "return x;"}
      - delay: 50ms
      - script.execute: canbus_charging_params
    unit_of_measurement: "Min"
    min_value: ${min_timeout}
    max_value: ${max_timeout}
    step     : ${step_timeout}

# this button if pressed in home assitant initializes the meanwell to become a power supply
# this usually has to be done only once and then the power supply should be turned off and on to accept the setting
# if in doubt check the flags if eeprom writing is off and if the mode is power supply or not
# the device will not be in "ready" state until these settings have been made
button:
  - platform: template
    name: PSU and EEPROM Off (AC ON-OFF to Apply)
    id: initialize_meanwell_button
    on_press:
      - logger.log: Button Pressed
      - switch.turn_on: power_psu_mode  # this switches to power supply mode, turn off and on is required to make this real
      - delay: 200ms
      - switch.turn_off: eeprom_writing # this turns the eeprom writing off, turn off and on is required to make this real
      - delay: 100ms  

  - platform: restart
    name: "Esp32 Restart"

  - platform: template
    name: "Read All Can Bus Params"
    id: read_all_can_bus
    on_press:
      - script.execute:
          id: canbus_read_vendor_info
      - script.execute:
          id: canbus_read_priority1
      - script.execute:
          id: canbus_read_priority2
      - script.execute:
          id: canbus_charging_params

    entity_category: diagnostic

 

switch:
  #- platform: template
  #  name: "Autostart"
  #  id: autostart_switch
  #  restore_mode: RESTORE_DEFAULT_ON
  #  optimistic: true
    #on_turn_on:
    #  - if:
    #      condition:
    #        lambda: 'return millis() > 5000;'
    #      then:    
    #         - logger.log: "on_turn_on do_autostart"
    #         - script.execute: {id: do_autostart}
    #on_turn_off:
    #  then:
    #    - switch.turn_off: main_power              # PowerOFF via PINS
    #    - delay: 50ms
    #    - switch.turn_off: power_meanwell_button   # PowerOFF via CAN
        
  - platform: template
    name: "Boost Charger in PSU Mode"
    id: psu_charger_boost_master
    icon: "mdi:power-cycle"
    optimistic: true
    on_turn_on:
      then:
        - text_sensor.template.publish:
            id: psu_charger_status
            state: "Start Bulk Charger"
    on_turn_off:
      then:
        # set voltage to float value
        - number.set:
            id: meanwell_next_target_voltage 
            value: !lambda "return id(mw_curve_fv).state;"
        - text_sensor.template.publish:
            id: psu_charger_status
            state: "Off (Idle)"
        - globals.set:
            id: psu_charger_stage1_cc_start_ms
            value: "0"
        - globals.set:
            id: psu_charger_stage2_cv_start_ms
            value: "0"
        - globals.set:
            id: psu_charger_cv_confirm_counter
            value: "0"

  - platform: template
    name: "Esp32 Enable Polling"
    id: polling_switch
    optimistic: true
    restore_mode: ALWAYS_ON
    on_turn_on:
      - script.execute:
          id: canbus_read_vendor_info
      - component.resume: interval1
      - component.resume: interval2
      - component.resume: interval3
    on_turn_off:
      - component.suspend: interval1
      - component.suspend: interval2
      - component.suspend: interval3
    entity_category: diagnostic

    
    # Master switch (pins in connector)
  - platform: gpio
    name: "_Power via Pins"
    pin: 
      number: ${gpio_pc817} 
    id: main_power
    restore_mode: RESTORE_DEFAULT_ON

    # this switch allows to turn the meanwell on
    # only turn it on if it is in "ready" state    
  - platform: template
    name: "_Power via CAN"
    id: power_meanwell_button
    turn_on_action:
      - canbus.send: {use_extended_id: true, can_id: 0xC0103, data: [0x00, 0x00, 0x01]}
      - delay: 50ms
      - script.execute: {id: canbus_refresh, cmd: 0x00}      
    turn_off_action:
      - canbus.send: {use_extended_id: true, can_id: 0xC0103, data: [0x00, 0x00, 0x00]}
      - delay: 50ms
      - script.execute: {id: canbus_refresh, cmd: 0x00}

    # Power Suply Mode
  - platform: template
    name: "_Power Suply Mode (AC ON-OFF to Apply)"
    id: power_psu_mode
    turn_on_action:  
      - script.execute: { id: psu_mode_action, state: false }
    turn_off_action: 
      - script.execute: { id: psu_mode_action, state: true }
          
    # EEPROM Writing    
  - platform: template
    name: EEPROM writing
    id: eeprom_writing
    turn_on_action:  
      - script.execute: { id: eeprom_writing_action, state: false }
    turn_off_action: 
      - script.execute: { id: eeprom_writing_action, state: true }
          
select:
  - platform: template
    name: "Charging Curve (Read Only, DIP SW position)"
    id: charging_curve_select
    options:
      - "00 - Customized"
      - "01 - Pre-defined, gel battery"
      - "10 - Pre-defined, flooded battery"
      - "11 - Pre-defined, AGM battery,LiFe04"
    optimistic: true
    #set_action:
      #- canbus.send: {use_extended_id: true, can_id: 0xC0103, data: !lambda "return prepare_can_packet_set_2bits(0xB4, 0, id(mw_config_b4), id(charging_curve_select).index_of(x).value());"}
      #- delay: 50ms
      #- script.execute: {id: canbus_refresh, cmd: 0xB4}

  - platform: template
    name: "PowerOn behavior"
    id: power_on_init
    options:
      - "OFF"
      - "ON"
      - "Last setting"
      - "Not Used"
    set_action:
      - canbus.send: {use_extended_id: true, can_id: 0xC0103, data: !lambda "return prepare_can_packet_set_2bits(0xC2, 1, id(mw_config_c2), id(power_on_init).index_of(x).value());"}
      - delay: 50ms
      - script.execute: {id: canbus_refresh, cmd: 0xC2}


