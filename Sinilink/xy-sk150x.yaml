    name: "MPPT Switch"
    address: 0x001F
    register_type: holding
    bitmask: 1

  - platform: modbus_controller
    modbus_controller_id: sk120x
    name: "Constant Power Mode"
    address: 0x0022
    register_type: holding
    bitmask: 1


  - platform: modbus_controller
    modbus_controller_id: sk120x
    name: "Power on Boot"
    address: 0x005D
    register_type: holding
    bitmask: 1

script:
  - id: force_sync
    mode: restart
    then:
      - delay: 100ms 
      - component.update: sk120x