select:
  - platform: modbus_controller
    modbus_controller_id: sk120x
    name: "Presets"
    optimistic: true
    address: 0x001D
    optionsmap:
      "Preset 0": 0
      "Preset 1": 1
      "Preset 2": 2
      "Preset 3": 3
      "Preset 4": 4
      "Preset 5": 5
      "Preset 6": 6
      "Preset 7": 7
      "Preset 8": 8
      "Preset 9": 9
switch:
  - platform: modbus_controller
    modbus_controller_id: sk120x
    id: master_power_modbus
    name: "! Master Power"
    address: 0x001E
    register_type: holding
    bitmask: 1
    icon: "mdi:power"
    inverted: true      # 1 is off. 0 is on
    write_lambda: |-    # Send 1 to turn ON. # Chinese perfomance. Do not ask why it is work :) 
      return x ? 0 : 1;
    on_turn_on: 
      - script.execute: force_sync
    on_turn_off: 
      - script.execute: force_sync

  - platform: modbus_controller
    modbus_controller_id: sk120x
    name: "! Output"
    address: 0x0012
    register_type: holding
    bitmask: 1
    
  - platform: modbus_controller
    modbus_controller_id: sk120x
    name: "Key Lock"
    address: 0x000F
    register_type: holding
    bitmask: 1

  - platform: modbus_controller
    modbus_controller_id: sk120x
