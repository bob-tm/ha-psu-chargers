esphome:
  name: xy-sk150x
  friendly_name: Charger XY-SK150X

esp32:
  board: seeed_xiao_esp32c3
  variant: esp32c3
  framework:
    type: arduino
    
  

web_server:
  port: 80
  version: 3

light:
  - platform: status_led
    name: "Esp32 Status Led"
    pin: 
      number: GPIO3

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO2
      mode: INPUT_PULLUP
      inverted: true 
    name: "My Button"
    internal: true 
    filters:
      - delayed_on: 50ms
    on_press:
      then:
        - switch.toggle: master_power_modbus

uart:
  id: uart_bus
  tx_pin: GPIO10
  rx_pin: GPIO9
  baud_rate: 115200  

modbus:
  id: mod_bus
  uart_id: uart_bus

modbus_controller:
  - id: sk120x
    address: 0x01
    setup_priority: -10
    update_interval: 7s
    command_throttle: 100ms
    offline_skip_updates: 2

text_sensor:
  - platform: modbus_controller
    modbus_controller_id: sk120x
    name: "Operating Mode (CV-CC)"
    address: 0x0011
    register_type: holding
    lambda: |-
      uint16_t val = (data[item->offset] << 8) | data[item->offset + 1]; 

      if (val == 0) {
        return {"CV"};
      } else if (val == 1) {
        return {"CC"};
      } else {
        ESP_LOGI("MODBUS", "Invalid Data");
        return {"Unknown: " + std::to_string(val)};
      }

  - platform: modbus_controller
    modbus_controller_id: sk120x
    name: "Protection Status"
    address: 0x0010
    register_type: holding
    lambda: |-
      uint16_t val = (data[item->offset] << 8) | data[item->offset + 1]; 

      static const char* const status_map[] = {
        "Ok",                   // 0
        "Over Voltage",         // 1
        "Over Current",         // 2
        "Over Power",           // 3
        "Low Input Voltage",    // 4
        "Over AH",              // 5
        "Over Time",            // 6
        "Internal Temperature", // 7
        "OEP ",                 // 8
        "Over WH",              // 9
        "Input Current",        // 10
        "Extermal Temperature"  // 11
      };

      if (val >= 0 && val <= 11) {
        return {status_map[val]};
      } else {
        ESP_LOGI("MODBUS", "Invalid Data");
        return {std::to_string(val)};
      }

sensor:
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "Esp32 WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic
    
  - platform: modbus_controller
    modbus_controller_id: sk120x
    name: "External Temperature"
    address: 0x000E
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: sk120x
    name: "Firmware Version"
    address: 0x0017
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - round: 2
    state_class: "measurement"
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: sk120x
    name: "Model ID"
    address: 0x0016
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: sk120x
    name: "Measured Output Voltage"
    address: 0x0002
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: sk120x
    name: "Measured Output Current"
    address: 0x0003
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "A"
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: sk120x
    name: "Measured Output Power"
    address: 0x0004
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "W"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: sk120x
    name: "Input Voltage"
    address: 0x0005
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: sk120x
    name: "Capacity"
    address: 0x0006
    register_type: holding
    value_type: U_DWORD_R
    unit_of_measurement: "Ah"
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: sk120x
    name: "Energy"
    address: 0x0008
    register_type: holding
    value_type: U_DWORD_R
    unit_of_measurement: "Wh"
    accuracy_decimals: 3
    filters:
      - multiply: 0.01

