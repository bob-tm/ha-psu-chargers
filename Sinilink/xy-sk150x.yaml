  - platform: modbus_controller
    modbus_controller_id: sk120x
    name: "Runtime"
    address: 0x000A
    register_type: holding
    value_type: RAW
    register_count: 3
    unit_of_measurement: "s"
    device_class: duration
    accuracy_decimals: 0
    lambda: |-
      size_t start = item->offset;
      uint16_t h = (data[start + 0] << 8) | data[start + 1];
      uint16_t m = (data[start + 2] << 8) | data[start + 3];
      uint16_t s = (data[start + 4] << 8) | data[start + 5];
      
      return (float)((h * 3600) + (m * 60) + s);

  - platform: modbus_controller
    modbus_controller_id: sk120x
    name: "Onboard Temperature"
    address: 0x000D
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    entity_category: diagnostic

